<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="Browse and download book image folders, newest first.">
    <title>Book Storage</title>
    <link rel="canonical" href="https://bookstorage.justsimpleapps.online/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Book Storage">
    <meta property="og:description" content="Browse and download book image folders, newest first.">
    <meta property="og:url" content="https://bookstorage.justsimpleapps.online/">
    <meta property="og:image" content="https://bookstorage.justsimpleapps.online/site/share-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Book Storage, with a charcoal folder holding photo prints on a light background.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preload" href="./site/fonts/space-grotesk-300.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./site/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./site/styles.css">
    <script defer src="./site/vendor/jszip.min.js"></script>
    <script type="module" src="./site/app.js"></script>
  </head>
  <body>
    <main class="archive" id="collections">
      <div class="folder-toolbar">
        <div class="folder-heading">
          <h1>Folders</h1>
          <span id="folder-total" class="folder-total" aria-label="Loading folder count">…</span>
        </div>
        <div class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <label class="visually-hidden" for="collection-search">Search folders</label>
          <input id="collection-search" type="search" placeholder="Search folders" autocomplete="off">
          <span class="search-shortcut" aria-hidden="true">/</span>
        </div>
      </div>

      <div class="listing-meta">
        <p><span id="collection-count">ALL FOLDERS</span> <span id="visible-count" class="visible-count"></span></p>
        <p class="order-label">NEWEST FIRST <span aria-hidden="true">↓</span></p>
      </div>
      <div id="sync-status" class="sync-status" role="status" hidden></div>
      <div id="collection-list" class="collection-grid" aria-live="polite" aria-busy="true">
        <div class="loading-state"><span class="loading-dot" aria-hidden="true"></span> Loading folders…</div>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg>
        <h2>No folders found</h2>
        <p>Try a different search.</p>
      </div>
      <noscript><p class="noscript">Enable JavaScript to browse and download folders, or <a href="https://github.com/owaiskhan-ash/RemindME/tree/main">view them on GitHub</a>.</p></noscript>
    </main>

    <dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-title">
      <div class="dialog-frame">
        <div class="dialog-heading">
          <div class="dialog-title-group">
            <span class="dialog-kicker">FOLDER PREVIEW</span>
            <h2 id="preview-title">Folder contents</h2>
            <p id="preview-summary"></p>
          </div>
          <button id="close-preview" class="icon-button dialog-close" type="button" aria-label="Close preview">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
        <div id="preview-content" class="dialog-content"></div>
      </div>
    </dialog>
  </body>
</html>
